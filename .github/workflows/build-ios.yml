name: Build iOS App

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Build type (development/release)'
        required: true
        default: 'development'
        type: choice
        options:
        - development
        - release

jobs:
  build-ios:
    runs-on: macos-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    - name: Setup Ruby
      uses: ruby/setup-ruby@v1
      with:
        ruby-version: '3.0'
        bundler-cache: true

    - name: Install CocoaPods
      run: |
        cd ios
        pod install --repo-update
        cd ..

    - name: Create ExportOptions.plist
      run: |
        mkdir -p ios
        cat > ios/ExportOptions.plist << 'EOF'
        <?xml version="1.0" encoding="UTF-8"?>
        <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
        <plist version="1.0">
        <dict>
            <key>method</key>
            <string>development</string>
            <key>teamID</key>
            <string></string>
            <key>uploadBitcode</key>
            <false/>
            <key>compileBitcode</key>
            <false/>
            <key>uploadSymbols</key>
            <true/>
            <key>signingStyle</key>
            <string>automatic</string>
            <key>signingCertificate</key>
            <string>iOS Development</string>
        </dict>
        </plist>
        EOF

    - name: Build iOS app for Simulator (No Code Signing)
      run: |
        xcodebuild -workspace ios/ChillChatApp.xcworkspace \
          -scheme ChillChatApp \
          -configuration Release \
          -destination 'platform=iOS Simulator,name=iPhone 14' \
          -derivedDataPath ios/build/DerivedData \
          CODE_SIGN_IDENTITY="" \
          CODE_SIGNING_REQUIRED=NO \
          CODE_SIGNING_ALLOWED=NO

    - name: Create IPA from Simulator Build
      run: |
        mkdir -p ios/build/ipa
        # Find the app bundle
        APP_PATH=$(find ios/build/DerivedData -name "*.app" | head -1)
        if [ -n "$APP_PATH" ]; then
          # Create Payload directory
          mkdir -p ios/build/ipa/Payload
          # Copy app to Payload
          cp -r "$APP_PATH" ios/build/ipa/Payload/
          # Create IPA
          cd ios/build/ipa
          zip -r ChillChatApp.ipa Payload/
          cd ../../..
          echo "IPA created successfully"
        else
          echo "App bundle not found"
          exit 1
        fi

    - name: Upload IPA as artifact
      uses: actions/upload-artifact@v4
      with:
        name: ChillChatApp-IPA
        path: ios/build/ipa/*.ipa
        retention-days: 30

    - name: Upload to Release (on tag)
      if: startsWith(github.ref, 'refs/tags/')
      uses: softprops/action-gh-release@v1
      with:
        files: ios/build/ipa/*.ipa
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: Comment PR with download link
      if: github.event_name == 'pull_request'
      uses: actions/github-script@v7
      with:
        script: |
          github.rest.issues.createComment({
            issue_number: context.issue.number,
            owner: context.repo.owner,
            repo: context.repo.repo,
            body: '📱 iOS build completed! Download the IPA from the [Actions artifacts](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})'
          })