name: Build iOS App for Device

on:
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Build type'
        required: true
        default: 'simulator'
        type: choice
        options:
        - simulator
        - device

jobs:
  build-ios-device:
    runs-on: macos-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    - name: Setup Ruby
      uses: ruby/setup-ruby@v1
      with:
        ruby-version: '3.0'
        bundler-cache: true

    - name: Install CocoaPods
      run: |
        cd ios
        pod install --repo-update
        cd ..

    - name: Build for iOS Simulator
      if: github.event.inputs.build_type == 'simulator'
      run: |
        xcodebuild -workspace ios/ChillChatApp.xcworkspace \
          -scheme ChillChatApp \
          -configuration Release \
          -destination 'platform=iOS Simulator,name=iPhone 15' \
          -derivedDataPath ios/build/DerivedData \
          CODE_SIGN_IDENTITY="" \
          CODE_SIGNING_REQUIRED=NO \
          CODE_SIGNING_ALLOWED=NO \
          build

    - name: Build for iOS Device (Development)
      if: github.event.inputs.build_type == 'device'
      run: |
        # Create a temporary keychain
        security create-keychain -p "" build.keychain
        security default-keychain -s build.keychain
        security unlock-keychain -p "" build.keychain
        security set-keychain-settings -t 3600 -l build.keychain
        
        # Build with automatic signing
        xcodebuild -workspace ios/ChillChatApp.xcworkspace \
          -scheme ChillChatApp \
          -configuration Release \
          -destination generic/platform=iOS \
          -archivePath ios/build/ChillChatApp.xcarchive \
          -allowProvisioningUpdates \
          archive || echo "Archive failed, continuing with simulator build..."

    - name: Create IPA from Build
      run: |
        mkdir -p ios/build/ipa
        
        # Check if we have an archive (device build)
        if [ -d "ios/build/ChillChatApp.xcarchive" ]; then
          echo "Found archive, exporting IPA..."
          xcodebuild -exportArchive \
            -archivePath ios/build/ChillChatApp.xcarchive \
            -exportPath ios/build/ipa \
            -exportOptionsPlist ios/ExportOptions.plist || {
              echo "Export failed, falling back to simulator build..."
              # Fallback to simulator
              xcodebuild -workspace ios/ChillChatApp.xcworkspace \
                -scheme ChillChatApp \
                -configuration Release \
                -destination 'platform=iOS Simulator,name=iPhone 15' \
                -derivedDataPath ios/build/DerivedData \
                CODE_SIGN_IDENTITY="" \
                CODE_SIGNING_REQUIRED=NO \
                CODE_SIGNING_ALLOWED=NO \
                build
              
              # Create IPA from simulator build
              APP_PATH=$(find ios/build/DerivedData -name "*.app" | head -1)
              if [ -n "$APP_PATH" ]; then
                mkdir -p ios/build/ipa/Payload
                cp -r "$APP_PATH" ios/build/ipa/Payload/
                cd ios/build/ipa
                zip -r ChillChatApp.ipa Payload/
                cd ../../..
              fi
            }
        else
          echo "No archive found, creating IPA from simulator build..."
          # Find simulator build
          APP_PATH=$(find ios/build/DerivedData -name "*.app" | head -1)
          if [ -n "$APP_PATH" ]; then
            mkdir -p ios/build/ipa/Payload
            cp -r "$APP_PATH" ios/build/ipa/Payload/
            cd ios/build/ipa
            zip -r ChillChatApp.ipa Payload/
            cd ../../..
            echo "Simulator IPA created successfully"
          else
            echo "No app bundle found"
            exit 1
          fi
        fi

    - name: Verify IPA creation
      run: |
        if [ -f "ios/build/ipa/ChillChatApp.ipa" ]; then
          echo "✅ IPA file created successfully"
          ls -lh ios/build/ipa/ChillChatApp.ipa
        else
          echo "❌ IPA file not found"
          ls -la ios/build/ipa/
          exit 1
        fi

    - name: Upload IPA as artifact
      uses: actions/upload-artifact@v4
      with:
        name: ChillChatApp-IPA-${{ github.event.inputs.build_type }}
        path: ios/build/ipa/ChillChatApp.ipa
        retention-days: 30

    - name: Create Release (on manual trigger)
      if: github.event_name == 'workflow_dispatch'
      uses: softprops/action-gh-release@v1
      with:
        tag_name: ios-build-${{ github.run_number }}
        name: iOS Build ${{ github.run_number }}
        body: |
          🍎 iOS Build for ChillChatApp
          
          **Build Type**: ${{ github.event.inputs.build_type }}
          **Build Date**: ${{ github.event.head_commit.timestamp }}
          **Commit**: ${{ github.sha }}
          
          📱 **Installation Instructions:**
          1. Download the ChillChatApp.ipa file
          2. Install using AltStore, TestFlight, or similar tool
          3. Trust the developer certificate in iOS Settings
          
          ⚠️ **Note**: This is a ${{ github.event.inputs.build_type }} build.
        files: ios/build/ipa/ChillChatApp.ipa
        draft: false
        prerelease: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}